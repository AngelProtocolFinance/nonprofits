name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# runs on blacksmith (blacksmith.sh), as better-giving/better-giving does: the app is installed on
# the org and the runner label is the whole integration. blacksmith proxies the standard cache
# actions to its own colocated cache, so `cache: pnpm` below is accelerated as-is.
jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
