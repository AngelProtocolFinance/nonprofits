name: monthly import
on:
  schedule:
    # the 3rd, after the IRS's month-end revocation list and mid-month BMF, Pub 78 and e-file index refreshes
    - cron: "17 6 3 * *"
  workflow_dispatch:
    inputs:
      force_verify_failure:
        description: Build the whole file, then fail verify, so nothing is published
        type: boolean
        default: false
permissions:
  contents: read
  # only for the failure issue
  issues: write
concurrency:
  group: monthly-import
  cancel-in-progress: false
jobs:
  import:
    # blacksmith (blacksmith.sh), as in ci.yml
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 350
    steps:
      - name: Check the Turso secrets are set
        env:
          TURSO_APP_DB_URL: ${{ secrets.TURSO_APP_DB_URL }}
          TURSO_APP_DB_TOKEN: ${{ secrets.TURSO_APP_DB_TOKEN }}
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_GROUP: ${{ secrets.TURSO_GROUP }}
        run: |
          missing=()
          for name in TURSO_APP_DB_URL TURSO_APP_DB_TOKEN TURSO_PLATFORM_TOKEN TURSO_ORG TURSO_GROUP; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing repository secret::${missing[*]} not set: add under Settings > Secrets and variables > Actions"
            exit 1
          fi
          # any other app database publishes to files on the runner, which nothing serves
          case "$TURSO_APP_DB_URL" in
            libsql://* | https://*) ;;
            *)
              echo "::error title=Not a Turso Cloud database::TURSO_APP_DB_URL must be the app database's libsql:// URL"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Disk space before the import
        run: df -h .
      - name: Import
        id: import
        # under the job's timeout, so the steps below still run; a step timeout
        # fails the step (outcome failure), it doesn't cancel it
        timeout-minutes: 335
        env:
          TURSO_APP_DB_URL: ${{ secrets.TURSO_APP_DB_URL }}
          TURSO_APP_DB_TOKEN: ${{ secrets.TURSO_APP_DB_TOKEN }}
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_GROUP: ${{ secrets.TURSO_GROUP }}
          FORCE_VERIFY_FAILURE: ${{ inputs.force_verify_failure }}
        run: |
          args=(refresh)
          if [ "$FORCE_VERIFY_FAILURE" = true ]; then args+=(--force-verify-failure); fi
          # exec: the runner signals only the step's own process, and a bash
          # waiting on node would leave it to the SIGKILL that follows
          exec node packages/import/src/cli.ts "${args[@]}" --summary "$RUNNER_TEMP/import-summary.md"
      - name: Run summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/import-summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          # the summary's **Cleanup:** line (renderSummary in packages/import/src/summary.ts)
          if [ -f "$summary" ] && grep -q '^\*\*Cleanup:\*\*' "$summary"; then
            echo "::warning title=Database left behind::it holds Turso storage, and the next swap may not fit, until the command in the run summary's Cleanup line is run"
          fi
      - name: Open or comment on the failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const title = "Monthly IRS import failed";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let quoted = ["No run summary was written; the run's log says why."];
            try {
              const lines = fs.readFileSync(`${process.env.RUNNER_TEMP}/import-summary.md`, "utf8").split("\n");
              quoted = [
                lines.find((line) => /^\*\*(Failed|Stopped):\*\*/.test(line)) ??
                  "The run summary records no failure; the run's log says why.",
                ...lines.filter((line) => /^\*\*(Nothing switched|Cleanup):\*\*/.test(line)),
              ];
            } catch {}
            // the summary clips each line; this bounds the body far under GitHub's 65,536 characters whatever it holds
            const body = `The ${context.eventName} run ${runUrl} failed. The database served before it still serves unless the summary says otherwise. There is no rollback: once a new database serves, the one before it is deleted.\n\n${quoted.map((line) => `> ${line}`).join("\n>\n").slice(0, 20_000)}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              creator: "github-actions[bot]",
              per_page: 100,
            });
            const issue = open.find((i) => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Clean up downloads, load files and the built file
        if: always()
        # data/ holds the downloads and the file the import built
        run: |
          rm -rf data load
          df -h .
